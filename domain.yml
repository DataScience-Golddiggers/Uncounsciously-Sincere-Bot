version: "3.1"

intents:
  - greet
  - goodbye
  - nlu_fallback
  - ask_deadlines
  - apply_for_course
  - inform
  - bot_challenge
  - ask_requirements
  - ask_web_info
  - newsletter_request
  - inform_email
  - user_angry

entities:
  - course_name
  - degree_type
  - student_name
  - email
  - topic
  - course_id
  - degree_field
  - degree_id

slots:
  degree_field:
    type: text
    mappings:
      - type: from_entity
        entity: degree_field

  degree_id:
    type: text
    mappings:
      - type: from_entity
        entity: degree_id

  student_name:
    type: text
    mappings:
      - type: from_entity
        entity: student_name
      - type: from_text
        conditions:
         - active_loop: enrollment_form
           requested_slot: student_name
  
  degree_type:
    type: text
    mappings:
      - type: from_entity
        entity: degree_type
      - type: from_text
        conditions:
          - active_loop: enrollment_form
            requested_slot: degree_type
  
  course_name:
    type: text
    mappings:
      - type: from_entity
        entity: course_name

  selected_courses:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: enrollment_form
            requested_slot: selected_courses

  requested_slot:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  email:
    type: text
    mappings:
      - type: from_entity
        entity: email
      - type: from_text
        conditions:
          - active_loop: enrollment_form
            requested_slot: email
  
  topic:
    type: text
    mappings:
      - type: from_entity
        entity: topic
        conditions:
          - active_loop: null
      - type: from_intent
        intent: ask_web_info
        value: "general"

forms:
  enrollment_form:
    required_slots:
      - student_name
      - degree_field
      - degree_type
      - degree_id
      - selected_courses
      - email
  
  newsletter_form:
    required_slots:
      - email

actions:
  - action_send_email
  - action_get_university_info
  - validate_enrollment_form
  - action_send_enrollment_email
  - action_ask_degree_id
  - action_ask_selected_courses

